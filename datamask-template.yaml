    Properties:
      RestApiId: !Ref DataMaskApi
      ParentId: !GetAtt DataMaskApi.RootResourceId
      PathPart: documents

  # /documents/{id}
  DocumentByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DataMaskApi
