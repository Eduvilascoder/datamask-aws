  # =============================================================================
  # API Gateway — Deployment y Stage
  # =============================================================================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadPresignPost
      - DocumentsPost
      - DocumentsGet
      - DocumentsDelete
      - DocumentsPurgePost
      - DocumentByIdGet
      - DocumentByIdDelete
      - DocumentDownloadTypeGet
      - DocumentsS3ListGet
      - DocumentsS3DownloadGet
      - DocumentsS3ObjectDelete
      - DocumentsProcessPost
      - ConfigDetectionGet
      - ConfigDetectionPut
      - ConfigModelsGet
      - UploadPresignOptions
      - DocumentsOptions
      - DocumentsPurgeOptions
      - DocumentByIdOptions
      - DocumentDownloadTypeOptions
      - DocumentsS3ListOptions
      - DocumentsS3DownloadOptions
      - DocumentsS3ObjectOptions
      - DocumentsProcessOptions
      - ConfigDetectionOptions
      - ConfigModelsOptions
    Properties:
      RestApiId: !Ref DataMaskApi
      Description: 'Deployment con authorizer Cognito (auth v2)'

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref DataMaskApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment
      Description: !Sub 'DataMask API Stage (${Environment})'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          DataTraceEnabled: !If [IsDev, true, false]
          LoggingLevel: !If [IsDev, INFO, ERROR]
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Application
          Value: DataMask
        - Key: Stack
          Value: !Ref 'AWS::StackName'

  # =============================================================================
  # SNS — Topic de alertas y suscripción email
  # =============================================================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'datamask-${Environment}-alerts'
      DisplayName: !Sub 'DataMask ${Environment} - Alertas'
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Application
          Value: DataMask
        - Key: Stack
          Value: !Ref 'AWS::StackName'

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # =============================================================================
  # CloudWatch Alarms — Errores Lambda > 5 en 5 minutos
  # =============================================================================
  TriggerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'datamask-${Environment}-trigger-errors'
      AlarmDescription: !Sub 'Errores en Lambda Trigger superan 5 en 5 minutos (${Environment})'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TriggerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  DetectionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'datamask-${Environment}-detection-errors'
      AlarmDescription: !Sub 'Errores en Lambda Detection superan 5 en 5 minutos (${Environment})'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DetectionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  RedactionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'datamask-${Environment}-redaction-errors'
      AlarmDescription: !Sub 'Errores en Lambda Redaction superan 5 en 5 minutos (${Environment})'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RedactionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  ApiHandlerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'datamask-${Environment}-api-handler-errors'
      AlarmDescription: !Sub 'Errores en Lambda API Handler superan 5 en 5 minutos (${Environment})'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiHandlerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # =============================================================================
  # CloudWatch Alarm — Latencia P99 API Gateway > 3 segundos
  # =============================================================================
  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'datamask-${Environment}-api-p99-latency'
      AlarmDescription: !Sub 'Latencia P99 de API Gateway supera 3 segundos en 5 minutos (${Environment})'
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub 'datamask-${Environment}-api'
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # =============================================================================
  # CloudWatch Alarm — DLQ mensajes visibles > 0
  # =============================================================================
  DlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'datamask-${Environment}-dlq-messages'
      AlarmDescription: !Sub 'Hay mensajes en la Dead Letter Queue — investigar errores en el pipeline (${Environment})'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

# =============================================================================
# Outputs — Valores exportados para integración con frontend y otros stacks
# =============================================================================
Outputs:
  ApiUrl:
    Description: URL base del API Gateway REST para integración con el frontend
    Value: !Sub 'https://${DataMaskApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'datamask-${Environment}-api-url'

  DocumentsBucketName:
    Description: Nombre del bucket S3 para documentos (originales, procesados, ofuscados)
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub 'datamask-${Environment}-documents-bucket'

  DocumentsTableName:
    Description: Nombre de la tabla DynamoDB de documentos
    Value: !Ref DocumentsTable
    Export:
      Name: !Sub 'datamask-${Environment}-documents-table'

  DocumentsTableArn:
    Description: ARN de la tabla DynamoDB de documentos
    Value: !GetAtt DocumentsTable.Arn
    Export:
      Name: !Sub 'datamask-${Environment}-documents-table-arn'

  AlertsTopicArn:
    Description: ARN del topic SNS para alertas del sistema
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub 'datamask-${Environment}-alerts-topic-arn'

  KmsKeyArn:
    Description: ARN de la clave KMS utilizada para cifrado S3
    Value: !GetAtt S3KmsKey.Arn
    Export:
      Name: !Sub 'datamask-${Environment}-kms-key-arn'

  DeadLetterQueueUrl:
    Description: URL de la cola SQS Dead Letter Queue para errores del pipeline
    Value: !Ref DeadLetterQueue
    Export:
      Name: !Sub 'datamask-${Environment}-dlq-url'

  ApiGatewayId:
    Description: ID del API Gateway REST
    Value: !Ref DataMaskApi
    Export:
      Name: !Sub 'datamask-${Environment}-api-id'

  CognitoUserPoolId:
    Description: ID del User Pool de Cognito
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub 'datamask-${Environment}-cognito-user-pool-id'

  CognitoUserPoolClientId:
    Description: ID del App Client de Cognito (usado por la SPA)
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub 'datamask-${Environment}-cognito-client-id'

  CognitoDomain:
    Description: Dominio de Cognito Hosted UI (login)
    Value: !If
      - HasCognitoDomainPrefix
      - !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
      - !Sub 'datamask-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub 'datamask-${Environment}-cognito-domain'

  CognitoSamlAcsUrl:
    Description: >-
      ACS URL (Assertion Consumer Service) para configurar la app SAML en
      IAM Identity Center.
    Value: !If
      - HasCognitoDomainPrefix
      - !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/saml2/idpresponse'
      - !Sub 'https://datamask-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/saml2/idpresponse'

  CognitoSamlAudienceUri:
    Description: >-
      Audience URI (SP Entity ID) para configurar la app SAML en IAM
      Identity Center.
    Value: !Sub 'urn:amazon:cognito:sp:${CognitoUserPool}'
