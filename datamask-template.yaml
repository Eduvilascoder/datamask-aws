    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DataMaskApi
      ResourceId: !Ref UploadPresignResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-Content-Sha256'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
